<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1600px;
            margin: 0;
            padding: 2px;
            background-color: #f5f5f5;
        }
        
        .container {
            background: white;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2px;
            font-size: 18px;
        }
        
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background-color: #f8f9fa;
        }

        .overdue-tasks {
            color: #e74c3c;
            font-weight: bold;
        }

        button {
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .head-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
	    margin-bottom: 2px;
	    padding: 0;
        }

        .countdown {
            font-weight: bold;
            color: #2c3e50;
            min-width: 120px;
	    font-size: 10px;
	    text-align: right;
        }

        /*.podium-1,
        .podium-2,
        .podium-3 {
            animation: blinkAnimation 2s infinite;
        }
*/
 /*      @keyframes blinkAnimation {*/
          /*  0% { background-color: rgba(255, 182, 193, 0.3); }*/ /* бледно-красный */
           /* 50% { background-color: rgba(255, 255, 255, 0.1); }*/ /* почти прозрачный */
           /* 100% { background-color: rgba(255, 182, 193, 0.3); }*/ /* бледно-красный */
       /* }*/

        /* Дополнительные стили для первых трех мест */
        .podium-1 {
            font-weight: bold;
            font-size: 20px;
	    background-color: #fffacd;
	    border-left: 4px solid gold;
        }

        .podium-2 {
            font-weight: bold;
            font-size: 19px;
	    background-color: #f0f0f0;
	    border-left: 4px solid silver;
        }

        .podium-3 {
            font-weight: bold;
            font-size: 18px;
	    background-color: #ffe4b5;
	    border-left: 4px solid #cd7f32; 
        }
	
    </style>
</head>
<body>
    <div>
        <div class="head-container">
         <!--   <button onclick="goToConfigPage()">Конфигурация</button> -->
            <div class="countdown" id="countdown">Следующее обновление через: --:--</div>
        </div>
        <!--h1>ТОП сотрудников</h1 -->
        <table id="usersTable">
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Всего задач</th>
                        <th>Просрочено</th>
                        <th>Без даты</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
        </table>

    </div>

    <script>

        class User {
            id = null;
            login = null;
            firstname = null;
            lastname = null;
            admin = null;
            main = null;
            last_login = null;
            created_on = null;
            all_tasks = null;
            closed_tasks = null;
            outdated_tasks = null;
            without_date_tasks = null;
            checked = false;

            
            constructor(userData = {}) {
                Object.assign(this, userData);
            }

            getFullUsername() {
                return `${this.firstname} ${this.lastname}`;
            }

            getTotalTasksNumber() {
                if (this.all_tasks) {
                    return this.all_tasks.length;
                }
                throw Error("Null Field");
            }

            getClosedTasksNumber() {
                if (this.all_tasks) {
                    if (this.closed_tasks === null) {
                        this.closed_tasks = 0;
                        this.closed_tasks = this.all_tasks.reduce((count, task) => {
                            if (task.status && (task.status.name === "Закрыта" || task.status.name === "Отклонена")) {
                                return count + 1;
                            }
                            return count;
                        }, 0);
                    }
                    return this.closed_tasks;
                }
                throw Error("Null Field");
            }

            getActiveTaskNumber() {
                if (this.all_tasks) {
                    return this.getTotalTasksNumber() - this.getClosedTasksNumber();
                }
                throw Error("Null Field");
            }

            getOutdatedTaskNumber() {
                if (this.all_tasks) {
                    if (this.outdated_tasks === null) {
                        this.outdated_tasks = 0;
                        this.without_date_tasks = 0;
                        console.log(`Load again outdated (${this.name}, ${this.outdated_tasks})`);
                        const now = new Date();

                        const endOfToday = new Date(now);
                        endOfToday.setHours(0,0,0,0);

                        for (const task of this.all_tasks) {
                            const dueDate = task.due_date ? new Date(task.due_date) : null;
                            if (dueDate) {
                                dueDate.setHours(0, 0, 0, 0);
                                if (dueDate < endOfToday) {
                                    this.outdated_tasks ++;
                                }
                            } else {
                                this.without_date_tasks ++;
                            }
                        }
                    }
                    return this.outdated_tasks;
                }
                throw Error("Null Field");
            }

            getWitoutdateTasksNumber() {
                if (this.all_tasks) {
                    if (this.without_date_tasks === null) {
                        this.without_date_tasks = 0;
                        console.log("Load again without date");
                        this.getOutdatedTaskNumber();
                    }
                    return this.without_date_tasks;
                }
                throw Error("Null Field");
            }
        }

        async function getAllUserTasks(userId) {
            let offset = 0;
            let hasMore = true;
            let resultTasks = []
            try {
                while (hasMore) {
                    const response = await fetch(`/api/issues.json?assigned_to_id=${userId}&limit=100&offset=${offset}`);
                    if (response.ok) {
                        const data = await response.json();
                        console.log(data);
                        if (data.issues.length > 0)
                            resultTasks.push(...data.issues);
                        if ((data.offset + data.issues.length) < data.total_count) {
                            offset = data.offset + data.issues.length;
                        } else {
                            hasMore = false;
                            continue;
                        }
                    } else {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                }
            } catch (error) {
                throw error;
            }

            return resultTasks;
        }

        let allUsers = []
        let autoRefreshInterval = null
        let countdownInterval = null
        const REFRESH_INTERVAL = 60000
        let timeUntilRefresh = REFRESH_INTERVAL / 1000

        document.addEventListener('DOMContentLoaded', function(){
            console.log('Loading page rating DONE!!!');
            const selectedUsers = JSON.parse(localStorage.getItem('selectedUsers') || '[]');

            console.log(`Selected users from storage: ${selectedUsers.length}`);


            if (selectedUsers.length > 0) {
                allUsers = selectedUsers.map(userData => new User(userData));
                sortUsersByOutdatedTasks();
                startAutorefresh();
                startCountdown();
            } else {
                alert("Пользователи не выбраны!");
                goToConfigPage();
            }
        });

        function sortUsersByOutdatedTasks() {

            allUsers.sort((a, b) => {
                return b.getOutdatedTaskNumber() - a.getOutdatedTaskNumber();
            });
            updateUsersTable();
        }

        function updateUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            allUsers.forEach((user, index) => {
                const row = document.createElement('tr');

                // Добавляем классы для первых трех мест
                if (index === 0) {
                    row.classList.add('podium-1');
                } else if (index === 1) {
                    row.classList.add('podium-2');
                } else if (index === 2) {
                    row.classList.add('podium-3');
                }
               
                row.innerHTML = `
                    <td>
                        <strong>
                            ${index + 1}. ${user.name}
                            ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : ''}
                        </strong>
                    </td>
                    <td><strong>${user.getTotalTasksNumber()}</strong></td>
                    <td class="overdue-tasks">${user.getOutdatedTaskNumber()}</td>
                    <td style="color: #777777;">${user.getWitoutdateTasksNumber()}</td>
                `;
                tbody.appendChild(row);
            });

        }

        function startCountdown() {
            // Сбрасываем время до обновления
            timeUntilRefresh = REFRESH_INTERVAL / 1000;
            
            // Очищаем предыдущий интервал, если он есть
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // Сразу обновляем отображение
            updateCountdownDisplay();
            
            // Запускаем новый интервал
            countdownInterval = setInterval(() => {
                timeUntilRefresh--;
                updateCountdownDisplay();
                
                if (timeUntilRefresh <= 0) {
                    timeUntilRefresh = REFRESH_INTERVAL / 1000; // Сбрасываем таймер
                }
            }, 1000);
        }

        function updateCountdownDisplay() {
            const countdownElement = document.getElementById('countdown');
            const minutes = Math.floor(timeUntilRefresh / 60);
            const seconds = Math.floor(timeUntilRefresh % 60);
            
            countdownElement.textContent = `Следующее обновление через: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function stopCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            const countdownElement = document.getElementById('countdown');
            countdownElement.textContent = 'Следующее обновление через: --:--';
        }

        function goToConfigPage() {
            stopAutorefresh();
            localStorage.setItem('loadOldInfo', true);
            window.location.href = 'deadtasks.html';
        }

        function startAutorefresh() {
            console.log("Start autorefresh");
            autoRefreshInterval = setInterval(refreshData, REFRESH_INTERVAL);
        }

        function stopAutorefresh() {
            console.log("Stop autorefresh");
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
            stopCountdown();
        }

        async function refreshData() {
            try {
                console.log("Start refresh");
                stopCountdown(); // Останавливаем таймер на время обновления
                
                for (const user of allUsers) {
                    user.all_tasks = await getAllUserTasks(user.id);
                    // Сбрасываем кэшированные значения
                    user.closed_tasks = null;
                    user.outdated_tasks = null;
                    user.without_date_tasks = null;
                }
                console.log("Stop refresh");
                
                // Сохраняем обновленные данные
                localStorage.setItem('selectedUsers', JSON.stringify(allUsers));
                
            } catch (error) {
                console.error("Update error:", error);
            }

            sortUsersByOutdatedTasks();
            startCountdown(); // Перезапускаем таймер после обновления
        }

        // Останавливаем автообновление при закрытии страницы
        window.addEventListener('beforeunload', function() {
            stopAutorefresh();
        });

    </script>
</body>
